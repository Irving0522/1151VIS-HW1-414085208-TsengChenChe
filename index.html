  <h1>出生越來越少，老人越來越多：<br>台灣在 2025 年跨過「超高齡社會」門檻</h1>

  <section class="card">

  </section>

  <p class="source">資料來源：內政部戶政司「出生數及粗出生率（按登記日期，全國）」、「人口年齡結構重要指標」。

<script>
/* ============================================================
 * HW2 預留：兩張圖都讀同一個 x 比例尺和 state；
 * 之後加 hover 十字線、刷選放大、年份動畫，只要改 state 再呼叫 update()
 * ============================================================ */
const state = { yearFrom: 1958, yearTo: 2025 };
const W = 900, H = 290, M = { t: 24, r: 110, b: 28, l: 56 };

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtN = d3.format(',');
const fmtWan = d => (d / 10000).toFixed(d < 100000 ? 1 : 0) + ' 萬';

/* ============================================================
 * 資料載入與清理：直接讀 Excel「另存新檔 → CSV」的原始檔，不需事先整理
 *   data/births_raw.csv ← 出生數及粗出生率（工作表「全國(登記)」）
 *   data/age_raw.csv    ← 人口年齡結構指標
 * ============================================================ */

// 1. 讀資料：優先用內嵌 CSV；否則讀外部檔並自動判斷編碼：先試 UTF-8，失敗就當 Big5（Excel 一般「CSV」存檔是 Big5）
async function loadRows(url, embeddedId) {
  // 有內嵌資料就用內嵌的（雙擊開啟也能看）；沒有才去讀外部 CSV 檔
  const embedded = document.getElementById(embeddedId)?.textContent.trim();
  if (embedded) return d3.csvParseRows(embedded.replace(/^\uFEFF/, ''));

  const buf = await d3.buffer(url);
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { text = new TextDecoder('big5').decode(buf); }
  return d3.csvParseRows(text.replace(/^﻿/, ''));   // 去掉 BOM，逐列讀成陣列
}

// 2. 把儲存格轉成數字：處理千分位逗號、空白、「…」「-」等缺值符號
function num(cell) {
  if (cell == null) return null;
  const s = String(cell).replace(/[,\s]/g, '');
  if (s === '' || /^[…\-－—]+$/.test(s)) return null;
  const v = +s;
  return Number.isFinite(v) ? v : null;
}

// 3. 只留資料列：第一欄是「民國NN年」的才算，並換成西元年
function dataRows(rows) {
  return rows
    .map(r => ({ r, m: String(r[0] ?? '').match(/民國\s*(\d+)\s*年/) }))
    .filter(d => d.m)
    .map(d => ({ year: +d.m[1] + 1911, r: d.r }));
}

async function loadData() {
  const [birthRaw, ageRaw] = await Promise.all([
    loadRows('data/births_raw.csv', 'births-csv'),
    loadRows('data/age_raw.csv', 'age-csv'),
  ]);

  // 出生檔欄位：0 民國年｜1 西元年｜2 出生數計｜3 男｜4 女｜5 性比例｜6 粗出生率
  const births = dataRows(birthRaw).map(({ year, r }) => ({ year, births: num(r[2]), birth_rate: num(r[6]) }));

  // 年齡檔欄位：0 民國年｜1 西元年｜2 總計｜之後每個年齡層兩欄（人數、%）
  const GROUPS = ['0_4', '0_6', '0_11', '12_17', '20p', '65p'];
  const ages = dataRows(ageRaw).map(({ year, r }) => {
    const o = { year, total_pop: num(r[2]) };
    GROUPS.forEach((g, i) => { o['pop_' + g] = num(r[3 + i * 2]); o['pct_' + g] = num(r[4 + i * 2]); });
    return o;
  });

  // 4. 依年份合併（出生資料從 1958、年齡資料從 1974 開始，沒有的欄位是 null）
  const ageByYear = d3.index(ages, d => d.year);
  const years = d3.sort(d3.union(births.map(d => d.year), ages.map(d => d.year)));
  const birthByYear = d3.index(births, d => d.year);
  const data = years.map(y => ({ ...birthByYear.get(y), ...ageByYear.get(y), year: y }))
    .filter(d => d.births != null);

  console.table(data.slice(-3));   // 開 F12 檢查最後三年有沒有讀對
  return data;
}

loadData().then(data => {
  const last = data.at(-1);
  const peak = d3.greatest(data, d => d.births);
  const firstAge = data.find(d => d.pct_65p != null);
  const cross = t => data.find(d => d.pct_65p >= t);

  /* ---- 文字與數字卡：全部從資料算出來，換資料就會自動更新 ---- */
  d3.select('#lede').html(
    `${peak.year} 年台灣一年出生 ${fmtN(peak.births)} 人；到了 ${last.year} 年只剩 ${fmtN(last.births)} 人，不到當年的 ${Math.ceil(last.births / peak.births * 10) * 10}%。
     同一段時間，65 歲以上人口比例從 ${firstAge.year} 年的 ${firstAge.pct_65p.toFixed(1)}% 一路爬升到 ${last.pct_65p.toFixed(1)}%。`);

  const stats = [
    { k: `${last.year} 年出生數`, v: fmtN(last.births), d: `${peak.year} 年高峰的 ${(last.births / peak.births * 100).toFixed(0)}%` },
    { k: `${last.year} 年 65 歲以上比例`, v: last.pct_65p.toFixed(1) + '%', d: `約每 ${Math.round(100 / last.pct_65p)} 人就有 1 位長者` },
    { k: `${last.year} 年 0–11 歲比例`, v: last.pct_0_11.toFixed(1) + '%', d: `${firstAge.year} 年為 ${firstAge.pct_0_11.toFixed(1)}%` },
  ];
  d3.select('#stats').selectAll('.stat').data(stats).join('div').attr('class', 'stat')
    .html(d => `<div class="k">${d.k}</div><div class="v">${d.v}</div><div class="d">${d.d}</div>`);

  /* ---- 共用 x 軸 ---- */
  const x = d3.scaleLinear([state.yearFrom, state.yearTo], [M.l, W - M.r]);

  /* ---- 圖 1：出生數 ---- */
  {
    const svg = d3.select('#births');
    const rows = data.filter(d => d.births != null);
    const y = d3.scaleLinear([0, d3.max(rows, d => d.births)], [H - M.b, M.t]).nice();
    drawAxes(svg, x, y, d => d === 0 ? '0' : fmtWan(d));

    svg.append('path').datum(rows).attr('fill', css('--births-fill')).attr('opacity', 0.6)
      .attr('d', d3.area().x(d => x(d.year)).y0(y(0)).y1(d => y(d.births)));
    svg.append('path').datum(rows).attr('fill', 'none').attr('stroke', css('--births')).attr('stroke-width', 2)
      .attr('d', d3.line().x(d => x(d.year)).y(d => y(d.births)));

    const dragon = rows.find(d => d.year === 2012);
    annotate(svg, x(peak.year), y(peak.births), `${peak.year} 年高峰`, fmtN(peak.births) + ' 人', css('--births'), 'up');
    if (dragon) annotate(svg, x(dragon.year), y(dragon.births), '2012 龍年', fmtN(dragon.births) + ' 人', css('--births'), 'up');
    annotate(svg, x(last.year), y(last.births), `${last.year} 年新低`, fmtN(last.births) + ' 人', css('--births'), 'end');

    addHover(svg, x, y, rows, d => d.births, css('--births'));
  }

  /* ---- 圖 2：65 歲以上比例 ---- */
  {
    const svg = d3.select('#elderly');
    const rows = data.filter(d => d.pct_65p != null);
    const y = d3.scaleLinear([0, 25], [H - M.b, M.t]);
    drawAxes(svg, x, y, d => d + '%');

    const TH = [{ v: 7, name: '高齡化社會' }, { v: 14, name: '高齡社會' }, { v: 20, name: '超高齡社會' }];
    const g = svg.append('g');
    g.selectAll('line').data(TH).join('line')
      .attr('x1', M.l).attr('x2', W - M.r).attr('y1', d => y(d.v)).attr('y2', d => y(d.v))
      .attr('stroke', css('--threshold')).attr('stroke-dasharray', '4 4');
    g.selectAll('text').data(TH).join('text').attr('class', 'th-label')
      .attr('x', M.l + 6).attr('y', d => y(d.v) - 5).text(d => `${d.v}%　${d.name}`);

    svg.append('path').datum(rows).attr('fill', css('--old-fill')).attr('opacity', 0.6)
      .attr('d', d3.area().x(d => x(d.year)).y0(y(0)).y1(d => y(d.pct_65p)));
    svg.append('path').datum(rows).attr('fill', 'none').attr('stroke', css('--old')).attr('stroke-width', 2)
      .attr('d', d3.line().x(d => x(d.year)).y(d => y(d.pct_65p)));

    // 跨過門檻的年份：從資料找，不寫死
    TH.forEach((t, i) => {
      const c = cross(t.v);
      if (!c) return;
      svg.append('circle').attr('cx', x(c.year)).attr('cy', y(c.pct_65p)).attr('r', 4.5)
        .attr('fill', css('--old')).attr('stroke', css('--panel')).attr('stroke-width', 2);
      svg.append('text').attr('class', 'anno').attr('text-anchor', i === 2 ? 'start' : 'end')
        .attr('x', x(c.year) + (i === 2 ? 10 : -8)).attr('y', y(c.pct_65p) + (i === 2 ? 4 : -8))
        .text(`${c.year} 年跨過 ${t.v}%`);
    });

    // 1958–1973 沒有年齡資料，標示出來避免誤會
    svg.append('text').attr('class', 'anno-sub').attr('text-anchor', 'middle')
      .attr('x', (x(state.yearFrom) + x(firstAge.year)) / 2).attr('y', y(3))
      .text(`${firstAge.year} 年前無資料`);

    addHover(svg, x, y, rows, d => d.pct_65p, css('--old'));
  }
});

/* ============================================================
 * Hover tooltip：滑鼠移到圖上，找出最近的年份，顯示垂直線、圓點和數值
 * ============================================================ */
const tip = d3.select('#tooltip');
const bisectYear = d3.bisector(d => d.year).center;   // 找離滑鼠最近的年份

function addHover(svg, x, y, rows, value, color) {
  const focus = svg.append('g').style('display', 'none').attr('pointer-events', 'none');
  const vline = focus.append('line').attr('y1', M.t).attr('y2', H - M.b)
    .attr('stroke', css('--text-3')).attr('stroke-width', 1).attr('stroke-dasharray', '3 3');
  const dot = focus.append('circle').attr('r', 5)
    .attr('fill', color).attr('stroke', css('--panel')).attr('stroke-width', 2);

  // 透明的感應區，蓋在整個繪圖範圍上
  svg.append('rect')
    .attr('x', M.l).attr('y', M.t).attr('width', W - M.l - M.r).attr('height', H - M.t - M.b)
    .attr('fill', 'transparent').style('cursor', 'crosshair')
    .on('pointerenter', () => { focus.style('display', null); tip.style('opacity', 1); })
    .on('pointerleave', () => { focus.style('display', 'none'); tip.style('opacity', 0); })
    .on('pointermove', event => {
      const [mx] = d3.pointer(event, svg.node());          // 滑鼠在 SVG 座標中的 x
      const d = rows[bisectYear(rows, x.invert(mx))];      // 換算成年份，找最近的資料
      vline.attr('x1', x(d.year)).attr('x2', x(d.year));
      dot.attr('cx', x(d.year)).attr('cy', y(value(d)));

      const row = (label, val, c) =>
        `<div class="row"><span><span class="sw" style="background:${c}"></span>${label}</span><b>${val}</b></div>`;
      tip.html(`<div class="yr">${d.year} 年（民國 ${d.year - 1911} 年）</div>`
        + row('出生數', fmtN(d.births) + ' 人', css('--births'))
        + row('粗出生率', d.birth_rate.toFixed(2) + '‰', css('--births'))
        + row('65 歲以上', d.pct_65p != null ? d.pct_65p.toFixed(2) + '%' : '無資料', css('--old')));

      // tooltip 跟著滑鼠，靠近右邊時改放左側
      const tw = tip.node().offsetWidth;
      const left = event.clientX + 16 + tw > window.innerWidth ? event.clientX - tw - 16 : event.clientX + 16;
      tip.style('left', left + 'px').style('top', (event.clientY + 16) + 'px');
    });
}

/* 共用：座標軸 + 水平格線 */
function drawAxes(svg, x, y, yFmt) {
  svg.append('g').attr('class', 'axis').attr('transform', `translate(${M.l},0)`)
    .call(d3.axisLeft(y).ticks(5).tickFormat(yFmt).tickSize(-(W - M.l - M.r)).tickPadding(8));
  svg.append('g').attr('class', 'axis').attr('transform', `translate(0,${H - M.b})`)
    .call(d3.axisBottom(x).ticks(12).tickFormat(d3.format('d')).tickSize(0).tickPadding(10));
}

/* 共用：點 + 兩行標註文字 */
function annotate(svg, cx, cy, title, sub, color, pos) {
  svg.append('circle').attr('cx', cx).attr('cy', cy).attr('r', 4.5)
    .attr('fill', color).attr('stroke', css('--panel')).attr('stroke-width', 2);
  const [dx, dy, anchor] = {
    right: [10, -4, 'start'],
    up:    [0, -30, 'middle'],
    end:   [10, -4, 'start'],
  }[pos];
  const t = svg.append('text').attr('text-anchor', anchor).attr('x', cx + dx).attr('y', cy + dy);
  t.append('tspan').attr('class', 'anno').text(title);
  t.append('tspan').attr('class', 'anno-sub').attr('x', cx + dx).attr('dy', 15).text(sub);
}
